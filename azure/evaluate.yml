$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: reservaiq_evaluate
version: '1'
display_name: Evaluar prueba reservada y guardar evidencias
type: command
code: ../
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: environment.yml
inputs:
  splits:
    type: uri_folder
  trained:
    type: uri_folder
outputs:
  report:
    type: uri_folder
command: >-
  env OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 LOKY_MAX_CPU_COUNT=2 python pipeline.py evaluate --splits ${{inputs.splits}} --trained ${{inputs.trained}} --out ${{outputs.report}}
