<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1110" viewBox="0 0 1520 1110" role="img" aria-labelledby="title desc"><title id="title">ReservaIQ: arquitectura de MICROPROYECTO3</title><desc id="desc">Datos, pipeline prepare train evaluate, registro del modelo, App Service y Blob privado. Prueba entra por separado a evaluate. Reservas nuevas no reentrenan el modelo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#73e4d3"/></marker><style>text{font-family:Arial,sans-serif;fill:#e7f1f5}.title{font-size:32px;font-weight:700}.h{font-size:22px;font-weight:700}.t{font-size:17px}.n{font-size:15px;fill:#aec5ce}.label{font-size:15px;fill:#73e4d3}</style></defs><rect width="1520" height="1110" fill="#0b141b" rx="22"/><text x="48" y="62" class="title">ReservaIQ · Del dato a una decisión revisable</text><text x="48" y="94" class="n">MICROPROYECTO3 · Azure North Central US · Re-ejecución del 1 de octubre de 2026 UTC</text><rect x="32" y="122" width="1456" height="947" fill="none" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="57" y="155" class="h">Grupo de recursos: MICROPROYECTO3</text><rect x="57" y="180" width="1406" height="420" fill="#0e1c25" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="81" y="215" class="h">Azure Machine Learning · ml-microproyecto3</text><text x="81" y="244" class="n">Entorno y componentes versionados · microproyecto3-cpu · Standard_DS2_v2 · mínimo 0 / máximo 1 nodo</text><rect x="81" y="294" width="247" height="148" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="101" y="329" class="h">Datos versionados</text><text x="101" y="362" class="t">reservaiq-hotels:1</text><text x="101" y="389" class="n">CSV de dos hoteles</text><text x="101" y="416" class="n">Guardado en Blob privado</text><rect x="389" y="294" width="263" height="148" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="409" y="329" class="h">1 · prepare</text><text x="409" y="362" class="t">Alcance y duplicados</text><text x="409" y="389" class="n">Partición temporal</text><text x="409" y="416" class="n">Train / validación / prueba</text><rect x="773" y="294" width="284" height="148" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="793" y="329" class="h">2 · train</text><text x="793" y="362" class="t">Compara tres algoritmos</text><text x="793" y="389" class="n">Selecciona en validación</text><text x="793" y="416" class="n">Fija modelo y umbral</text><rect x="1152" y="294" width="284" height="148" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="1172" y="329" class="h">3 · evaluate</text><text x="1172" y="362" class="t">Prueba reservada</text><text x="1172" y="389" class="n">Métricas y predicciones</text><text x="1172" y="416" class="n">Sin volver a entrenar</text><path d="M328 364H382" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M652 340H766" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="660" y="318" class="label">Train + valid.</text><path d="M1057 364H1145" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1067" y="343" class="label">Modelo</text><path d="M520 442V483H1289V449" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="770" y="470" width="300" height="28" fill="#0e1c25"/><text x="785" y="490" class="label">Prueba separada → evaluación</text><text x="83" y="552" class="n">Pipeline: microproyecto3-reejecucion-20261001 · prepare → train → evaluate</text><text x="83" y="577" class="n">reservaiq-entrega conserva código y documentación. Las nuevas reservas no modifican el dataset.</text><path d="M1396 442V638H389V690" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745" y="628" class="label">Después de verificar la evaluación</text><rect x="81" y="698" width="430" height="148" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="101" y="733" class="h">Registro del modelo</text><text x="101" y="766" class="t">reservaiq · versión 1</text><text x="101" y="793" class="n">Modelo y métricas descargados y verificados</text><text x="101" y="820" class="n">Huella SHA256 y procedencia de esta ejecución</text><rect x="597" y="698" width="412" height="148" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="617" y="733" class="h">Azure App Service · F1</text><text x="617" y="766" class="t">Aplicación web + API + modelo</text><text x="617" y="793" class="n">Calendario / CSV → validar → analizar</text><text x="617" y="820" class="n">Guardar → organizar → revisión humana</text><rect x="1146" y="698" width="290" height="148" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="1166" y="733" class="h">Blob privado</text><text x="1166" y="766" class="t">reservaiq-demo</text><text x="1166" y="793" class="n">Snapshot SQLite atómico</text><text x="1166" y="820" class="n">ETag evita sobrescrituras</text><path d="M511 768H590" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="747" class="label">Publicar</text><path d="M1009 764H1139" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1139 815H1016" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1030" y="742" class="label">Identidad</text><text x="1018" y="867" class="label">Lectura / escritura</text><path d="M796 943V853" fill="none" stroke="#73e4d3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="815" y="911" class="label">HTTPS</text><rect x="597" y="950" width="412" height="79" fill="#12222c" stroke="#34515d" stroke-width="1.5" rx="16"/><text x="619" y="981" class="h">Navegador del equipo / profesor</text><text x="619" y="1009" class="n">Demo compartida · usar solo datos ficticios</text><text x="81" y="931" class="h">Dos ciclos separados</text><text x="81" y="962" class="n">Entrenamiento: trabajo reproducible en Azure ML.</text><text x="81" y="989" class="n">Uso diario: inferencia, guardado y revisión.</text><text x="81" y="1016" class="n">No hay reentrenamiento automático.</text><text x="1115" y="944" class="n">F1: cuota diaria y arranque en frío.</text><text x="1115" y="973" class="n">SQLite se procesa en memoria;</text><text x="1115" y="997" class="n">Blob conserva la copia completa.</text><text x="48" y="1094" class="n">Hotel Brisa del Valle · Cliente ficticio · Evidencia de entrenamiento y reservas de prueba se conservan por separado.</text></svg>